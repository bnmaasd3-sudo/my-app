name: Android APK

# Builds a debug APK for testing on a phone. The app opens the deployed site,
# so set the repository variable QARI_URL (Settings → Secrets and variables →
# Actions → Variables) to the production URL, or pass it when running by hand.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Site the app opens (defaults to the QARI_URL variable)
        required: false
  push:
    branches: [main]
    paths:
      - android/**
      - android-shell/**
      - capacitor.config.ts
      - .github/workflows/android.yml
  pull_request:
    paths:
      - android/**
      - android-shell/**
      - capacitor.config.ts
      - .github/workflows/android.yml

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QARI_URL: ${{ inputs.url || vars.QARI_URL || 'https://qari.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Check that screenshots stay blocked
        run: grep -q "FLAG_SECURE" android/app/src/main/java/app/qari/reader/MainActivity.java
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: qari-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
