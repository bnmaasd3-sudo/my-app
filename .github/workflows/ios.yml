name: iOS build

# Compiles the iOS app for the simulator, without signing, to show the project
# and its screen protection build. Run it by hand (Actions → iOS build → Run
# workflow) after changing ios/: macOS runners cost more, so it does not run on
# every pull request. Releasing to the App Store needs a Mac with Xcode and an
# Apple developer account: see docs/ios.md.
on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      # Only shows the protection is still wired in; whether screenshots come out
      # blank must be tried on a device (docs/ios.md), as no runner can take one.
      - name: Check that screen protection is still wired in
        run: grep -q "ScreenGuard.hideFromScreenshots(content)" ios/App/App/SceneDelegate.swift
      - name: Build for the simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build
